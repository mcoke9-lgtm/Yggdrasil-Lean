name: Review-history resolver tests

on:
  push:
    paths:
      - "reference-model/**"
      - ".github/workflows/resolver-tests.yml"
  pull_request:
    paths:
      - "reference-model/**"
      - ".github/workflows/resolver-tests.yml"
  workflow_dispatch:

jobs:
  resolver-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run pure reference resolver tests
        run: node --test reference-model/review-history-resolver.test.mjs reference-model/full-field-snapshot-integrity.test.mjs
