name: AF Runtime Tests

on:
  push:
    branches:
      - af-runtime-001-reference-resolver
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  resolver-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run resolver regression tests
        run: PYTHONPATH=runtime python -m unittest discover -s runtime/tests -v
