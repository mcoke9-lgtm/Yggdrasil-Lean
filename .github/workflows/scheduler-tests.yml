name: Scheduler protocol tests

on:
  push:
    branches:
      - sch-001-handoff-protocol-001
    paths:
      - "scheduler/**"
      - ".github/workflows/scheduler-tests.yml"
  pull_request:
    paths:
      - "scheduler/**"
      - ".github/workflows/scheduler-tests.yml"
  workflow_dispatch:

jobs:
  scheduler-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run scheduler test suite
        working-directory: scheduler
        run: npm test
