name: Live GitHub stale-publisher CAS test

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-stale-publisher-cas
  cancel-in-progress: false

jobs:
  stale-publisher-cas:
    # This write-capable test is deliberately restricted to the trusted default branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the selected trusted branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Configure temporary commit identity
        run: |
          git config user.name "GitHub Actions stale-CAS test"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Verify GitHub rejects a stale forced ref update
        shell: bash
        run: |
          set -euo pipefail

          # Fixed prefix, unique run suffix, and no user-supplied ref names.
          test_branch="test/stale-publisher-cas-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          initial_sha="$(git rev-parse HEAD)"
          tree_sha="$(git rev-parse "${initial_sha}^{tree}")"
          push_log="$(mktemp)"

          intervening_sha="$(printf '%s\n' 'intervening publication for stale-CAS test' | git commit-tree "$tree_sha" -p "$initial_sha")"
          stale_sha="$(printf '%s\n' 'stale candidate for stale-CAS test' | git commit-tree "$tree_sha" -p "$initial_sha")"

          push_attempted=0
          cleanup() {
            # A push may reach GitHub even if the client loses its acknowledgement.
            # Delete only if the temporary ref still points to one of this run's commits.
            if [[ "$push_attempted" == "1" ]]; then
              observed_cleanup_sha="$(git ls-remote --heads origin "refs/heads/$test_branch" 2>/dev/null | awk 'NR == 1 {print $1}')" || observed_cleanup_sha=""
              case "$observed_cleanup_sha" in
                "$initial_sha"|"$intervening_sha"|"$stale_sha")
                  git push --force-with-lease="refs/heads/$test_branch:$observed_cleanup_sha" \
                    origin ":refs/heads/$test_branch" >/dev/null 2>&1 || {
                      echo "::warning::Could not safely delete temporary ref refs/heads/$test_branch; inspect and remove it manually."
                    }
                  ;;
                "")
                  # The initial push may never have created the ref, or it may already be gone.
                  ;;
                *)
                  echo "::warning::Temporary ref refs/heads/$test_branch changed to an unexpected head ($observed_cleanup_sha); leaving it untouched."
                  ;;
              esac
            fi
            rm -f "$push_log"
          }
          trap cleanup EXIT

          push_attempted=1
          git push origin "$initial_sha:refs/heads/$test_branch"

          # Establish the intervening writer with a current expected-head lease.
          git push --force-with-lease="refs/heads/$test_branch:$initial_sha" \
            origin "$intervening_sha:refs/heads/$test_branch"

          # A stale publisher still expects initial_sha. Confirm the failure is specifically stale-lease rejection.
          if git push --force-with-lease="refs/heads/$test_branch:$initial_sha" \
              origin "$stale_sha:refs/heads/$test_branch" >"$push_log" 2>&1; then
            cat "$push_log"
            echo "::error::Stale publication unexpectedly succeeded."
            exit 1
          fi
          cat "$push_log"
          if ! grep -Eiq 'stale info|stale lease|rejected.*stale' "$push_log"; then
            echo "::error::Push failed, but output did not identify stale-lease rejection."
            exit 1
          fi

          observed_sha="$(git ls-remote --heads origin "refs/heads/$test_branch" | awk '{print $1}')"
          if [[ "$observed_sha" != "$intervening_sha" ]]; then
            echo "::error::Temporary ref changed unexpectedly. Expected $intervening_sha; observed ${observed_sha:-<missing>}."
            exit 1
          fi

          echo "PASS: GitHub rejected the stale lease and retained the intervening head $intervening_sha."
