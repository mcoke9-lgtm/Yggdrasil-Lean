name: Live GitHub stale-publisher CAS test

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-stale-publisher-cas
  cancel-in-progress: false

jobs:
  stale-publisher-cas:
    # Run manually from the trusted default branch after this workflow is reviewed.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the selected trusted branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Configure temporary commit identity
        run: |
          git config user.name "GitHub Actions stale-CAS test"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Verify GitHub rejects a stale forced ref update
        shell: bash
        run: |
          set -euo pipefail

          # Fixed prefix, unique run suffix, and no user-supplied ref names.
          test_branch="test/stale-publisher-cas-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          initial_sha="$(git rev-parse HEAD)"
          tree_sha="$(git rev-parse "${initial_sha}^{tree}")"

          intervening_sha="$(printf '%s\n' 'intervening publication for stale-CAS test' | git commit-tree "$tree_sha" -p "$initial_sha")"
          stale_sha="$(printf '%s\n' 'stale candidate for stale-CAS test' | git commit-tree "$tree_sha" -p "$initial_sha")"

          created=0
          cleanup() {
            if [[ "$created" == "1" ]]; then
              git push origin --delete "$test_branch" >/dev/null 2>&1 || {
                echo "::warning::Could not delete temporary ref refs/heads/$test_branch; inspect and remove it manually."
              }
            fi
          }
          trap cleanup EXIT

          git push origin "$initial_sha:refs/heads/$test_branch"
          created=1

          # Establish the intervening writer with a current expected-head lease.
          git push --force-with-lease="refs/heads/$test_branch:$initial_sha" \
            origin "$intervening_sha:refs/heads/$test_branch"

          # A stale publisher still expects initial_sha. Its update must be rejected.
          if git push --force-with-lease="refs/heads/$test_branch:$initial_sha" \
              origin "$stale_sha:refs/heads/$test_branch"; then
            echo "::error::Stale publication unexpectedly succeeded."
            exit 1
          fi

          observed_sha="$(git ls-remote --heads origin "refs/heads/$test_branch" | awk '{print $1}')"
          if [[ "$observed_sha" != "$intervening_sha" ]]; then
            echo "::error::Temporary ref changed unexpectedly. Expected $intervening_sha; observed ${observed_sha:-<missing>}."
            exit 1
          fi

          echo "PASS: GitHub rejected the stale lease and retained the intervening head $intervening_sha."
