name: Analysis Engine

on:
  push:
    branches:
      - analysis-engine-prototype-001
      - independent-scheduler-prototype-001
    paths:
      - "analysis-engine/**"
      - "scheduler/**"
      - ".github/workflows/analysis-engine.yml"
  pull_request:
    paths:
      - "analysis-engine/**"
      - "scheduler/**"
      - ".github/workflows/analysis-engine.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check server and browser JavaScript syntax
        working-directory: analysis-engine
        run: node --check src/server.js && node --check src/public/app.js
      - name: Run automated tests
        working-directory: analysis-engine
        run: npm test
      - name: Run sample CSV analysis
        working-directory: analysis-engine
        run: |
          node src/cli.js samples/materials.csv /tmp/materials-report.json
          node --input-type=module -e "import fs from 'node:fs'; const r=JSON.parse(fs.readFileSync('/tmp/materials-report.json','utf8')); if (r.results.total_inspected_kg !== 230 || r.results.total_reusable_kg !== 162 || !r.verification.passed) process.exit(1);"
      - name: Run evidence and uncertainty sample
        working-directory: analysis-engine
        run: |
          node src/cli.js samples/materials_with_evidence.csv /tmp/evidence-report.json
          node --input-type=module -e "import fs from 'node:fs'; const r=JSON.parse(fs.readFileSync('/tmp/evidence-report.json','utf8')); if (r.uncertainty.status !== 'complete_record_bounds' || r.uncertainty.inspected_kg.min !== 221 || r.uncertainty.inspected_kg.max !== 239 || r.uncertainty.reusable_kg.min !== 153 || r.uncertainty.reusable_kg.max !== 171) process.exit(1);"

  scheduler-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check scheduler JavaScript syntax
        working-directory: scheduler
        run: node --check src/calendar.js && node --check src/store.js && node --check src/scheduler.js && node --check src/runner.js && node --check src/cli.js
      - name: Run scheduler tests
        working-directory: scheduler
        run: npm test
