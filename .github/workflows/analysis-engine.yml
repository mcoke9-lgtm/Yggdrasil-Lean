name: Analysis Engine

on:
  push:
    branches:
      - analysis-engine-prototype-001
    paths:
      - "analysis-engine/**"
      - ".github/workflows/analysis-engine.yml"
  pull_request:
    paths:
      - "analysis-engine/**"
      - ".github/workflows/analysis-engine.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run automated tests
        working-directory: analysis-engine
        run: npm test
      - name: Run sample CSV analysis
        working-directory: analysis-engine
        run: |
          node src/cli.js samples/materials.csv /tmp/materials-report.json
          node --input-type=module -e "import fs from 'node:fs'; const r=JSON.parse(fs.readFileSync('/tmp/materials-report.json','utf8')); if (r.results.total_inspected_kg !== 230 || r.results.total_reusable_kg !== 162 || !r.verification.passed) process.exit(1);"
