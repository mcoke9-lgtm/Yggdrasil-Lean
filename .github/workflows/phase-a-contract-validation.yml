name: Phase A Model Contract Validation

on:
  push:
    branches:
      - independent-builder-runtime-foundation-001
    paths:
      - "schemas/model-lifecycle-contracts-1.0.schema.json"
      - "schemas/nine-builder-capability-contracts-v0.1.json"
      - "schemas/capability-evaluation-rubric-v0.1.json"
      - "schemas/model-reduction-study-v0.1.json"
      - "tests/model-capabilities/**"
      - "scripts/validate_phase_a_contracts.py"
      - ".github/workflows/phase-a-contract-validation.yml"
  pull_request:
    branches:
      - main
    paths:
      - "schemas/model-lifecycle-contracts-1.0.schema.json"
      - "schemas/nine-builder-capability-contracts-v0.1.json"
      - "tests/model-capabilities/**"
      - "scripts/validate_phase_a_contracts.py"
      - ".github/workflows/phase-a-contract-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned schema validator
        run: python -m pip install --disable-pip-version-check jsonschema==4.25.1
      - name: Validate Phase A schemas, contracts, and fixture links
        run: python scripts/validate_phase_a_contracts.py
