name: Nine Builders Subject Registry Validation

on:
  push:
    branches:
      - subject-registry-cryptography-001
    paths:
      - "schemas/subject-registry-v1.schema.json"
      - "subject-registry/**"
      - "docs/NINE_BUILDER_CONVERSATION_PROTOCOL.md"
      - "scripts/validate_subject_registry.py"
      - "tests/subject-registry/**"
      - ".github/workflows/subject-registry-validation.yml"
  pull_request:
    branches:
      - independent-builder-runtime-foundation-001
    paths:
      - "schemas/subject-registry-v1.schema.json"
      - "subject-registry/**"
      - "docs/NINE_BUILDER_CONVERSATION_PROTOCOL.md"
      - "scripts/validate_subject_registry.py"
      - "tests/subject-registry/**"
      - ".github/workflows/subject-registry-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-subject-registry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned schema validator
        run: python -m pip install --disable-pip-version-check jsonschema==4.25.1
      - name: Validate registry and cross-record invariants
        run: python scripts/validate_subject_registry.py
      - name: Run subject registry tests
        run: python -m unittest discover -s tests/subject-registry -p 'test_*.py' -v
