name: Nine Builders Scheduler Runtime Tests

on:
  pull_request:
    paths:
      - 'scheduler/**'
      - '.github/workflows/nine-builders-scheduler.yml'
  push:
    branches: [nine-builders-overnight-runtime-001]
    paths:
      - 'scheduler/**'
      - '.github/workflows/nine-builders-scheduler.yml'

permissions:
  contents: read

jobs:
  scheduler-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run independent scheduler and Builder runtime tests
        working-directory: scheduler
        run: npm test
