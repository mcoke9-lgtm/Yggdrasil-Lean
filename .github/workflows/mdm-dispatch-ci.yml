name: MDM-001 WorkManager Dispatch CI

on:
  push:
    branches:
      - mdm-001-workmanager-dispatch-001
      - mdm-001-character-journal-handoff-001
      - mdm-001-journal-recovery-tests-001
      - mdm-001-cross-store-reconciliation-contract-001
      - mdm-001-authorized-recovery-planning-001
      - mdm-001-read-only-recovery-audit-001
  pull_request:
    branches:
      - mdm-001-workmanager-dispatch-001
      - mdm-001-character-journal-handoff-001

permissions:
  contents: read

jobs:
  android-tests-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run Android unit tests and compile app
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mdm-001-dispatch-unit-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 7
