name: THO-015 isolated regression probes

on:
  push:
    branches:
      - "tho-015/probe1-ci-bootstrap"
    paths:
      - "tho-015/**"
      - ".github/workflows/tho015-probe1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Execute Probe 1 — uncertain-commit retry
        env:
          PYTHONPATH: yim-001/src
        run: python tho-015/probe1_crash_retry.py
      - name: Execute Probe 2 — malformed-history validation
        env:
          PYTHONPATH: yim-001/src
        run: python tho-015/probe2_malformed_history.py
      - name: Execute Probe 4 — identifier compatibility observations
        env:
          PYTHONPATH: yim-001/src
        run: python tho-015/probe4_identifiers.py
