name: Android recovery unit tests

on:
  push:
    branches:
      - recovery-roundtrip-sequence-fix-001
  pull_request:
    branches:
      - subject-thread-continuity-001

permissions:
  contents: read

concurrency:
  group: android-recovery-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-unit-tests:
    name: Android Gradle unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Android local unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest
