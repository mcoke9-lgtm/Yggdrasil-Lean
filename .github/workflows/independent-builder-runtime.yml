name: Independent Builder Runtime Android

on:
  push:
    branches: [independent-builder-runtime-foundation-001]
    paths:
      - 'app/**'
      - '*.gradle'
      - 'gradle.properties'
      - '.github/workflows/independent-builder-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK platform and build tools
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Configure persistent Builder signing key when repository secrets exist
        env:
          KEYSTORE_BASE64: ${{ secrets.BUILDER_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.BUILDER_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BUILDER_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BUILDER_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64$KEYSTORE_PASSWORD$KEY_ALIAS$KEY_PASSWORD" ]; then
            echo "::warning::Persistent signing is not configured. This APK will use a temporary runner debug key and is not suitable as a stable update."
            exit 0
          fi
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Persistent signing secrets are only partially configured. Set all four BUILDER_* secrets."
            exit 1
          fi
          KEYSTORE_PATH="$RUNNER_TEMP/builder-host-signing.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          echo "BUILDER_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "BUILDER_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "BUILDER_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "BUILDER_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "Persistent Builder signing key configured."
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run unit tests and compile Android app
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Verify APK signature and print certificate digest
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: yggdrasil-builder-runtime-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
