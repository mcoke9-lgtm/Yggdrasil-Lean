name: Builder Conversation Journal

on:
  push:
    branches:
      - independent-builder-runtime-foundation-001
      - operational-snapshot-journal-muninn-pirate-001
  pull_request:
    branches:
      - independent-builder-runtime-foundation-001
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  conversation-journal-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run Android unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest
      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yggdrasil-unit-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 7
