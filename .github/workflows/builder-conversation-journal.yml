name: Builder Conversation Journal

on:
  push:
    branches:
      - independent-builder-runtime-foundation-001
  pull_request:
    branches:
      - independent-builder-runtime-foundation-001
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  conversation-journal-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run Android unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest
      - name: Assemble Android debug APK
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: yggdrasil-builder-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
