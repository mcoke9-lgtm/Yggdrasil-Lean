name: Builder Conversation Journal

on:
  push:
    branches:
      - independent-builder-runtime-foundation-001
  pull_request:
    branches:
      - independent-builder-runtime-foundation-001

permissions:
  contents: read

jobs:
  conversation-journal-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run Android unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest
