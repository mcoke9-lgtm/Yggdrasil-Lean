name: Installed Signer Diagnostic

on:
  push:
    branches: [installed-signer-diagnostic-001]
    paths:
      - 'signing-diagnostic/**'
      - 'settings.gradle'
      - 'build.gradle'
      - 'gradle.properties'
      - '.github/workflows/installed-signer-diagnostic.yml'
  pull_request:
    branches: [independent-builder-runtime-foundation-001]
    paths:
      - 'signing-diagnostic/**'
      - 'settings.gradle'
      - 'build.gradle'
      - 'gradle.properties'
      - '.github/workflows/installed-signer-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-diagnostic:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK platform and build tools
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Assemble isolated diagnostic APK
        run: gradle --no-daemon :signing-diagnostic:assembleDebug
      - name: Verify package identity, exact query scope, and offline permissions
        run: |
          APK="signing-diagnostic/build/outputs/apk/debug/signing-diagnostic-debug.apk"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -f "$APK"
          "$AAPT" dump badging "$APK" > "$RUNNER_TEMP/badging.txt"
          "$AAPT" dump permissions "$APK" > "$RUNNER_TEMP/permissions.txt"
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml > "$RUNNER_TEMP/manifest.txt"
          grep -F "package: name='org.yggdrasil.signingdiagnostic'" "$RUNNER_TEMP/badging.txt"
          if grep -q 'android.permission.INTERNET\|android.permission.ACCESS_NETWORK_STATE' "$RUNNER_TEMP/permissions.txt"; then
            echo "::error::Diagnostic must remain offline."
            exit 1
          fi
          grep -F 'org.yggdrasil.builderhost' "$RUNNER_TEMP/manifest.txt"
          grep -F 'org.yggdrasil.keysteward' "$RUNNER_TEMP/manifest.txt"
          if grep -Eq 'org.yggdrasil.(scheduler|keysteward)([^.]|$)' "$RUNNER_TEMP/badging.txt"; then
            echo "::error::Diagnostic package identity collides with a target app."
            exit 1
          fi
          "$APKSIGNER" verify --verbose --print-certs "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: installed-signer-diagnostic-apk
          path: signing-diagnostic/build/outputs/apk/debug/signing-diagnostic-debug.apk
          if-no-files-found: error
          retention-days: 14
