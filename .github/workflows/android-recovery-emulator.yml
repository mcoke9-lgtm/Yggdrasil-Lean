name: Android recovery emulator tests

on:
  push:
    branches:
      - recovery-roundtrip-sequence-fix-001
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-recovery-emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recovery-emulator:
    name: Recovery instrumentation on disposable API 35 emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK emulator and API 35 image
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install \
            "platform-tools" \
            "platforms;android-35" \
            "emulator" \
            "system-images;android-35;google_apis;x86_64"
          echo "${ANDROID_HOME}/platform-tools" >> "${GITHUB_PATH}"
          echo "${ANDROID_HOME}/emulator" >> "${GITHUB_PATH}"
          echo "${ANDROID_HOME}/cmdline-tools/latest/bin" >> "${GITHUB_PATH}"

      - name: Create disposable API 35 virtual device
        run: |
          echo "no" | "${ANDROID_HOME}/cmdline-tools/latest/bin/avdmanager" create avd \
            --name recovery-api35 \
            --package "system-images;android-35;google_apis;x86_64" \
            --device "pixel_2" \
            --force

      - name: Boot disposable emulator
        run: |
          "${ANDROID_HOME}/emulator/emulator" \
            -avd recovery-api35 \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -wipe-data \
            -gpu swiftshader_indirect \
            > "${RUNNER_TEMP}/recovery-emulator.log" 2>&1 &
          if ! timeout 180 adb wait-for-device; then
            echo "::error::Timed out waiting for the emulator to connect to ADB."
            adb devices -l || true
            tail -n 200 "${RUNNER_TEMP}/recovery-emulator.log" || true
            exit 1
          fi
          if ! timeout 300 bash -c 'until [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" == "1" ]]; do sleep 2; done'; then
            echo "::error::Timed out waiting for Android sys.boot_completed."
            adb devices -l || true
            adb shell getprop || true
            tail -n 200 "${RUNNER_TEMP}/recovery-emulator.log" || true
            exit 1
          fi
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell getprop ro.build.version.sdk
          adb shell getprop ro.build.version.release

      - name: Run Android recovery instrumentation tests
        run: ./gradlew --no-daemon :app:connectedDebugAndroidTest

      - name: Capture emulator diagnostics
        if: always()
        run: |
          mkdir -p "${RUNNER_TEMP}/recovery-emulator-artifacts"
          adb logcat -d > "${RUNNER_TEMP}/recovery-emulator-artifacts/logcat.txt" || true
          cp "${RUNNER_TEMP}/recovery-emulator.log" "${RUNNER_TEMP}/recovery-emulator-artifacts/" || true
          cp -R app/build/outputs/androidTest-results "${RUNNER_TEMP}/recovery-emulator-artifacts/" 2>/dev/null || true
          cp -R app/build/reports/androidTests "${RUNNER_TEMP}/recovery-emulator-artifacts/" 2>/dev/null || true

      - name: Upload emulator test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-recovery-emulator-evidence
          path: ${{ runner.temp }}/recovery-emulator-artifacts/
          if-no-files-found: warn
          retention-days: 14
