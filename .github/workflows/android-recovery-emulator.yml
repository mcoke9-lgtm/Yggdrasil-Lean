name: Android recovery emulator tests

on:
  push:
    branches:
      - recovery-roundtrip-sequence-fix-001
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-recovery-emulator-${{ github.ref }}
  cancel-in-progress: false

jobs:
  recovery-emulator:
    name: Recovery instrumentation on disposable API 35 emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Linux emulator runtime dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libpulse0t64
          echo "Checking emulator runtime dependencies after SDK installation will follow."

      - name: Install Android SDK emulator and API 35 image
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install \
            "platform-tools" \
            "platforms;android-35" \
            "emulator" \
            "system-images;android-35;google_apis;x86_64"
          echo "${ANDROID_HOME}/platform-tools" >> "${GITHUB_PATH}"
          echo "${ANDROID_HOME}/emulator" >> "${GITHUB_PATH}"
          echo "${ANDROID_HOME}/cmdline-tools/latest/bin" >> "${GITHUB_PATH}"

      - name: Verify Android SDK and emulator prerequisites
        run: |
          set -euo pipefail
          {
            echo "ANDROID_HOME=${ANDROID_HOME}"
            echo "PATH=${PATH}"
            echo "Runner kernel:"
            uname -a
            echo "Disk space:"
            df -h
            echo "ADB location and version:"
            command -v adb
            adb version
            echo "Emulator location and version:"
            command -v emulator
            emulator -version
            echo "Emulator shared-library dependencies:"
            EMULATOR_BIN="$(command -v emulator)"
            ldd "${EMULATOR_BIN}" | tee "${RUNNER_TEMP}/emulator-ldd.txt"
            if grep -q 'not found' "${RUNNER_TEMP}/emulator-ldd.txt"; then
              echo "::error::Emulator has unresolved shared-library dependencies."
              exit 1
            fi
            echo "Emulator acceleration check (informational):"
            emulator -accel-check || true
            echo "Installed AVDs before creation:"
            emulator -list-avds
          } 2>&1 | tee "${RUNNER_TEMP}/android-preflight.txt"

      - name: Create disposable API 35 virtual device
        run: |
          set -euo pipefail
          export ANDROID_AVD_HOME="${RUNNER_TEMP}/android-avd"
          echo "ANDROID_AVD_HOME=${RUNNER_TEMP}/android-avd" >> "${GITHUB_ENV}"
          mkdir -p "${ANDROID_AVD_HOME}"
          echo "no" | "${ANDROID_HOME}/cmdline-tools/latest/bin/avdmanager" create avd \
            --name recovery-api35 \
            --package "system-images;android-35;google_apis;x86_64" \
            --device "pixel_2" \
            --force
          echo "Created AVD files:"
          find "${ANDROID_AVD_HOME}" -maxdepth 3 -type f -print
          echo "AVD configuration:"
          cat "${ANDROID_AVD_HOME}/recovery-api35.avd/config.ini"
          echo "Available AVDs:"
          emulator -list-avds

      - name: Boot disposable emulator
        run: |
          set -euo pipefail
          LOG="${RUNNER_TEMP}/recovery-emulator.log"
          echo "Using ANDROID_AVD_HOME=${ANDROID_AVD_HOME}"
          ls -la "${ANDROID_AVD_HOME}"
          echo "ADB:"
          command -v adb
          adb version
          echo "Emulator:"
          command -v emulator
          emulator -version
          emulator -verbose \
            -avd recovery-api35 \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -wipe-data \
            -gpu swiftshader_indirect \
            > "${LOG}" 2>&1 &
          EMULATOR_PID=$!
          echo "Emulator PID=${EMULATOR_PID}"
          echo "Waiting up to 180 seconds for ADB device connection..."
          if ! timeout 180s adb wait-for-device; then
            echo "::error::Emulator process did not connect to ADB within 180 seconds."
            adb devices -l || true
            ps -ef | grep -E '[e]mulator|[q]emu' || true
            tail -n 300 "${LOG}" || true
            exit 1
          fi
          echo "ADB device connected. Waiting up to 300 seconds for Android boot completion..."
          if ! timeout 300s bash -c 'until [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" == "1" ]]; do sleep 2; done'; then
            echo "::error::ADB connected, but Android did not report sys.boot_completed=1 within 300 seconds."
            adb devices -l || true
            adb shell getprop sys.boot_completed || true
            adb shell getprop ro.boot.qemu || true
            tail -n 300 "${LOG}" || true
            exit 1
          fi
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          echo "Android API level:"
          adb shell getprop ro.build.version.sdk
          echo "Android release:"
          adb shell getprop ro.build.version.release

      - name: Run Android recovery instrumentation tests
        run: ./gradlew --no-daemon :app:connectedDebugAndroidTest

      - name: Capture emulator diagnostics
        if: always()
        run: |
          set +e
          OUT="${RUNNER_TEMP}/recovery-emulator-artifacts"
          mkdir -p "${OUT}"
          {
            echo "UTC timestamp:"
            date -u
            echo "Runner:"
            uname -a
            echo "ANDROID_HOME=${ANDROID_HOME}"
            echo "ANDROID_AVD_HOME=${ANDROID_AVD_HOME:-unset}"
            echo "Disk space:"
            df -h
            echo "ADB:"
            command -v adb
            adb version
            echo "Emulator:"
            command -v emulator
            emulator -version
            echo "AVD list:"
            emulator -list-avds
            echo "Relevant processes:"
            ps -ef | grep -E '[e]mulator|[q]emu|[a]db' || true
          } > "${OUT}/runner-diagnostics.txt" 2>&1
          timeout 30s adb devices -l > "${OUT}/adb-devices.txt" 2>&1
          timeout 30s adb shell getprop > "${OUT}/device-properties.txt" 2>&1
          timeout 45s adb logcat -d > "${OUT}/logcat.txt" 2>&1
          cp "${RUNNER_TEMP}/android-preflight.txt" "${OUT}/" 2>/dev/null || true
          cp "${RUNNER_TEMP}/recovery-emulator.log" "${OUT}/" 2>/dev/null || true
          cp -R app/build/outputs/androidTest-results "${OUT}/" 2>/dev/null || true
          cp -R app/build/reports/androidTests "${OUT}/" 2>/dev/null || true
          echo "Collected diagnostic files:"
          find "${OUT}" -maxdepth 4 -type f -print

      - name: Upload emulator test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-recovery-emulator-evidence
          path: ${{ runner.temp }}/recovery-emulator-artifacts/
          if-no-files-found: warn
          retention-days: 14
