name: Android unit tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  android-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Run Android JVM unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Run nine-process Android instrumentation test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest
