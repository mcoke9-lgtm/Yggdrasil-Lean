name: Android unit tests

concurrency:
  group: android-tests-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  android-unit-tests:
    # Bound the whole job so a wedged emulator cannot occupy a runner indefinitely.
    timeout-minutes: 35
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Run Android JVM unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Run nine-process Android instrumentation test
        timeout-minutes: 20
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          emulator-boot-timeout: 900
          script: |
            adb devices -l
            adb get-state
            adb shell getprop sys.boot_completed
            ./gradlew --no-daemon :app:connectedDebugAndroidTest

      # Every ADB operation is time-bounded so an offline emulator cannot block upload.
      - name: Collect Android test diagnostics
        if: always()
        timeout-minutes: 2
        run: |
          mkdir -p artifacts/android-emulator-diagnostics
          timeout --signal=TERM 8s adb devices -l \
            > artifacts/android-emulator-diagnostics/adb-devices-after-step.txt 2>&1 || true
          timeout --signal=TERM 8s adb shell getprop \
            > artifacts/android-emulator-diagnostics/device-properties-after-step.txt 2>&1 || true
          timeout --signal=TERM 12s adb logcat -d -v threadtime \
            > artifacts/android-emulator-diagnostics/logcat-after-step.txt 2>&1 || true
          find app/build/outputs/androidTest-results app/build/reports/androidTests -type f -print \
            > artifacts/android-emulator-diagnostics/test-output-files.txt 2>&1 || true
          printf 'diagnostic collection completed\n' \
            > artifacts/android-emulator-diagnostics/collection-status.txt

      - name: Upload Android test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-diagnostics
          path: |
            artifacts/android-emulator-diagnostics/**
            app/build/outputs/androidTest-results/**
            app/build/reports/androidTests/**
          if-no-files-found: warn
          retention-days: 7
