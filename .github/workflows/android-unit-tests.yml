name: Android unit tests

concurrency:
  group: android-tests-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  android-unit-tests:
    # Pin the hosted image while isolating the emulator startup failure observed
    # on ubuntu-26.04 (ADB offline and emulator console startup failure).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Run Android JVM unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Run nine-process Android instrumentation test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          emulator-boot-timeout: 900
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest
