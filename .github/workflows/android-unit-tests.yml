name: Android unit tests

concurrency:
  group: android-tests-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  android-unit-tests:
    # Keep the hosted image pinned while diagnosing emulator/ADB startup reliability.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Run Android JVM unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Run nine-process Android instrumentation test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          emulator-boot-timeout: 900
          script: |
            set +e
            mkdir -p artifacts/android-emulator-diagnostics
            trap '
              status=$?
              adb devices -l > artifacts/android-emulator-diagnostics/adb-devices-at-exit.txt 2>&1
              adb shell getprop > artifacts/android-emulator-diagnostics/device-properties-at-exit.txt 2>&1
              adb logcat -d -v threadtime > artifacts/android-emulator-diagnostics/logcat-at-exit.txt 2>&1
              exit "$status"
            ' EXIT

            adb devices -l
            adb get-state
            adb shell getprop sys.boot_completed
            ./gradlew --no-daemon :app:connectedDebugAndroidTest

      # This also runs when emulator startup or the instrumentation step fails.
      - name: Collect Android test diagnostics
        if: always()
        run: |
          mkdir -p artifacts/android-emulator-diagnostics
          adb devices -l > artifacts/android-emulator-diagnostics/adb-devices-after-step.txt 2>&1 || true
          adb logcat -d -v threadtime > artifacts/android-emulator-diagnostics/logcat-after-step.txt 2>&1 || true
          find app/build/outputs/androidTest-results app/build/reports/androidTests -type f -print             > artifacts/android-emulator-diagnostics/test-output-files.txt 2>&1 || true

      - name: Upload Android test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-diagnostics
          path: |
            artifacts/android-emulator-diagnostics/**
            app/build/outputs/androidTest-results/**
            app/build/reports/androidTests/**
          if-no-files-found: warn
          retention-days: 7
