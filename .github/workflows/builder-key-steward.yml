name: Builder Key Steward Android

on:
  push:
    branches: [builder-key-steward-foundation-001]
    paths:
      - 'key-steward/**'
      - 'settings.gradle'
      - 'build.gradle'
      - 'gradle.properties'
      - '.github/workflows/builder-key-steward.yml'
  pull_request:
    branches: [independent-builder-runtime-foundation-001]
    paths:
      - 'key-steward/**'
      - 'settings.gradle'
      - 'build.gradle'
      - 'gradle.properties'
      - '.github/workflows/builder-key-steward.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  key-steward-build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK platform and build tools
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Check Key Steward has no network permission
        run: |
          if grep -q 'android.permission.INTERNET' key-steward/src/main/AndroidManifest.xml; then
            echo "::error::Key Steward must remain offline."
            exit 1
          fi
      - name: Create disposable PKCS12 key for CI signing test
        run: |
          echo "BUILDER_TEST_KEYSTORE_OUTPUT=$GITHUB_WORKSPACE/key-steward/build/disposable-test-key.p12" >> "$GITHUB_ENV"
          echo "BUILDER_KEYSTORE_PATH=$GITHUB_WORKSPACE/key-steward/build/disposable-test-key.p12" >> "$GITHUB_ENV"
          echo "BUILDER_KEYSTORE_PASSWORD=disposable-test-password" >> "$GITHUB_ENV"
          echo "BUILDER_KEY_ALIAS=builder-upload-key" >> "$GITHUB_ENV"
          echo "BUILDER_KEY_PASSWORD=disposable-test-password" >> "$GITHUB_ENV"
      - name: Run tests and create app-generated disposable PKCS12
        run: gradle --no-daemon :key-steward:testDebugUnitTest
      - name: Assemble APK signed with app-generated disposable PKCS12
        run: gradle --no-daemon :key-steward:assembleDebug
      - name: Verify APK signature
        run: |
          APK="key-steward/build/outputs/apk/debug/key-steward-debug.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/apk-signer.txt"
          KEY_DIGEST="$(keytool -list -v -keystore "$BUILDER_KEYSTORE_PATH" -storetype PKCS12 \
            -storepass "$BUILDER_KEYSTORE_PASSWORD" | sed -n 's/.*SHA256: //p' | head -n 1 \
            | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          APK_DIGEST="$(sed -n 's/.*SHA-256 digest: //p' "$RUNNER_TEMP/apk-signer.txt" \
            | head -n 1 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          test -n "$KEY_DIGEST"
          test "$KEY_DIGEST" = "$APK_DIGEST"
          echo "Disposable PKCS12 certificate fingerprint matches the APK signer."
      - uses: actions/upload-artifact@v4
        with:
          name: builder-key-steward-debug-apk
          path: key-steward/build/outputs/apk/debug/key-steward-debug.apk
          if-no-files-found: error
          retention-days: 14
