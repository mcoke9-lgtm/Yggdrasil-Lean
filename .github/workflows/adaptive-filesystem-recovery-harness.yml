name: Adaptive Filesystem Recovery Harness

on:
  push:
    branches:
      - af-recovery-roundtrip-harness-v0
      - af-post-connection-report-contract-v2
  pull_request:
    branches:
      - main

jobs:
  recovery-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run all Adaptive Filesystem contract tests
        run: python -m unittest discover -s tests/adaptive_filesystem -p 'test_*.py' -v
