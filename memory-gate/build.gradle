plugins {
    id 'com.android.application'
}

android {
    namespace 'org.yggdrasil.memorygate'
    compileSdk 35

    defaultConfig {
        applicationId 'org.yggdrasil.memorygate'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
