plugins { id 'com.android.application' }

android {
    namespace 'org.yggdrasil.keysteward'
    compileSdk 35
    packaging {
        resources {
            excludes += ['META-INF/versions/9/OSGI-INF/MANIFEST.MF']
        }
    }
    defaultConfig {
        applicationId 'org.yggdrasil.keysteward'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    // Production retains the existing package identity. CI and Development
    // receive separate identities and can never update the Production install.
    buildTypes {
        debug {
            applicationIdSuffix '.ci'
            versionNameSuffix '-ci'
        }
        development {
            initWith debug
            applicationIdSuffix '.dev'
            versionNameSuffix '-dev'
            matchingFallbacks = ['debug']
        }
        release {
            // Identity-only build in CI; no production signing key is configured.
        }
    }
}

dependencies {
    implementation 'org.bouncycastle:bcprov-jdk18on:1.80'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.80'
    testImplementation 'junit:junit:4.13.2'
}
