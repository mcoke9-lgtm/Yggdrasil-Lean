plugins { id 'com.android.application' }

android {
    namespace 'org.yggdrasil.keysteward'

    signingConfigs {
        disposableCi {
            storeFile file(System.getenv('BUILDER_KEYSTORE_PATH') ?: 'missing.p12')
            storeType 'PKCS12'
            storePassword System.getenv('BUILDER_KEYSTORE_PASSWORD') ?: ''
            keyAlias System.getenv('BUILDER_KEY_ALIAS') ?: 'builder-upload-key'
            keyPassword System.getenv('BUILDER_KEY_PASSWORD') ?: ''
        }
    }
    compileSdk 35

    buildTypes {
        debug {
            // Keep CI/debug builds installable alongside the existing production app.
            applicationIdSuffix '.ci'
            if (System.getenv('BUILDER_KEYSTORE_PATH') != null) {
                signingConfig signingConfigs.disposableCi
            }
        }
    }

    defaultConfig {
        applicationId 'org.yggdrasil.keysteward'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
}

dependencies {
    implementation 'org.bouncycastle:bcprov-jdk15to18:1.86'
    implementation 'org.bouncycastle:bcpkix-jdk15to18:1.86'
    testImplementation 'junit:junit:4.13.2'
}


tasks.withType(Test).configureEach {
    def disposableOutput = System.getenv("BUILDER_TEST_KEYSTORE_OUTPUT")
    if (disposableOutput != null && !disposableOutput.isEmpty()) {
        systemProperty "builder.test.keystore.output", disposableOutput
    }
}
